[project]
name = "agent-runtime"
version = "0.1.0"
description = "Multi-agent-IM Agent Runtime — digital employee lifecycle and soul engine"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "python-dotenv>=1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0",
    "pgvector>=0.3.0",
    "grpcio>=1.62.0",
    "protobuf>=5.0",
]

[project.scripts]
agent-runtime = "agent_runtime.app:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
    "freezegun>=1.4.0",
    "faker>=24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "tests"]
markers = [
    "unit: 单元测试 (纯逻辑, 无IO)",
    "integration: 集成测试 (需真实DB/Redis/网络)",
    "llm: 需要调用LLM API的测试 (慢且花钱)",
    "slow: 耗时测试",
]
timeout = 10

[tool.coverage.run]
source = ["src"]
omit = ["src/**/test_*.py", "tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
