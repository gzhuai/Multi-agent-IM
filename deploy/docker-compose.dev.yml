# Multi-agent-IM 本地开发环境
# 用法: docker compose -f deploy/docker-compose.dev.yml up -d

version: "3.8"

services:
  # ============================================================
  # PostgreSQL 16 + pgvector — 持久化数据
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maim-postgres
    environment:
      POSTGRES_USER: maim
      POSTGRES_PASSWORD: maim_dev
      POSTGRES_DB: multiagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maim -d multiagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - maim-net

  # ============================================================
  # Redis 7 — 实时状态 / Pub/Sub / 消息队列
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: maim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - maim-net

  # ============================================================
  # MinIO — 对象存储 (文件/产物)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: maim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console (Web管理界面)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - maim-net

  # ============================================================
  # MinIO 初始化 — 自动创建 bucket
  # ============================================================
  minio-init:
    image: minio/mc:latest
    container_name: maim-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/agent-artifacts;
      mc mb --ignore-existing local/agent-attachments;
      mc mb --ignore-existing local/agent-avatars;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - maim-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  maim-net:
    driver: bridge
