# Multi-agent-IM production deployment
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-maim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maim_prod}
      POSTGRES_DB: ${DB_NAME:-multiagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-maim}"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  im-core:
    build:
      context: ../server/im-core
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-maim}
      DB_PASSWORD: ${DB_PASSWORD:-maim_prod}
      DB_NAME: ${DB_NAME:-multiagent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  agent-runtime:
    build:
      context: ../server/agent-runtime
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-maim}
      DB_PASSWORD: ${DB_PASSWORD:-maim_prod}
      DB_NAME: ${DB_NAME:-multiagent}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_PROVIDER_PRESET: ${LLM_PROVIDER_PRESET:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"

  api-gateway:
    build:
      context: ../server/api-gateway
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-maim}
      DB_PASSWORD: ${DB_PASSWORD:-maim_prod}
      DB_NAME: ${DB_NAME:-multiagent}
      IM_CORE_ADDR: im-core:8080
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      im-core:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../client/web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
